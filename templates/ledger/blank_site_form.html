{% extends "base.html" %}
{% block title %}{{ form_label }} | {{ site.name }}{% endblock %}
{% block content %}
<div class="page-heading compact-heading">
    <div>
        <div class="eyebrow"><a href="{% url 'site-dashboard' site.slug %}?date={{ selected_date|date:'Y-m-d' }}&amp;shift={{ shift_label|urlencode }}">{{ site.name }}</a> / {{ selected_date|date:"d M Y" }} / {{ shift_label }} shift</div>
        <h1>{{ form_label }}</h1>
    </div>
    <a class="button secondary" href="{% url 'site-form-history' site.slug form_key %}?date={{ selected_date|date:'Y-m-d' }}&amp;shift={{ shift_label|urlencode }}">History</a>
</div>
<section class="section-block">
    <p class="empty-state">This form is blank and ready to be built.</p>
</section>
{% endblock %}
